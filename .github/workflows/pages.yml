name: Play on GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  # Seasonal native worlds exceed GitHub's file limit, so CI packs the bundles that the
  # fixtures, network tests (berlin_1 and berlin_swap_1 summer; the room's side flip is
  # random) and default smoke roll (size 5) load.
  worlds:
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        bundle: [berlin_1_summer, berlin_swap_1_summer, berlin_5_autumn, berlin_5_spring, berlin_5_summer, berlin_5_winter,
          berlin_swap_5_autumn, berlin_swap_5_spring, berlin_swap_5_summer, berlin_swap_5_winter]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      # Only the packer's static dependency closure invalidates a cached bundle.
      - id: inputs
        shell: pwsh
        run: |
          $key = node tools/world_pack_inputs.mjs ${{ matrix.bundle }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "key=$key" >> $env:GITHUB_OUTPUT
      - id: cache
        uses: actions/cache@v4
        with:
          path: assets/worlds/${{ matrix.bundle }}.res
          key: world-${{ matrix.bundle }}-${{ env.GODOT_VERSION }}-${{ steps.inputs.outputs.key }}
      - name: Pack native world
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $release = "https://github.com/godotengine/godot-builds/releases/download/$env:GODOT_VERSION-stable"
          Invoke-WebRequest "$release/Godot_v$env:GODOT_VERSION-stable_win64.exe.zip" -OutFile "$env:RUNNER_TEMP/godot.zip"
          Expand-Archive "$env:RUNNER_TEMP/godot.zip" "$env:RUNNER_TEMP/godot"
          $godot = "$env:RUNNER_TEMP/godot/Godot_v$env:GODOT_VERSION-stable_win64_console.exe"
          New-Item -ItemType Directory -Force build | Out-Null
          New-Item -ItemType File -Force build/.gdignore | Out-Null
          & $godot --headless --path . --editor --import *> build/import.log
          if ($LASTEXITCODE -ne 0) { Get-Content build/import.log; exit 1 }
          # The importer needs a real driver; ANGLE runs on the runner's software D3D11 device.
          & $godot --path . --rendering-method gl_compatibility --rendering-driver opengl3_angle --disable-render-loop --audio-driver Dummy --position -32000,-32000 --resolution 1x1 res://tools/import_worlds.tscn -- "--bundle=${{ matrix.bundle }}" *> build/pack.log
          $code = $LASTEXITCODE
          $output = Get-Content build/pack.log -Raw
          Select-String -Path build/pack.log -Pattern 'OpenGL API|WORLD_IMPORTED'
          if ($code -ne 0 -or $output -match '(?m)^(SCRIPT ERROR:|ERROR:)' -or $output -notmatch 'WORLD_IMPORTED ${{ matrix.bundle }}') { Write-Output $output; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: world-${{ matrix.bundle }}
          path: assets/worlds/${{ matrix.bundle }}.res
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # tests/run.tscn exceeds one runner's budget on software ANGLE, so --fixture-shard splits
  # its suites. Each shard fails only on failures beyond tests/fixture_baseline.json.
  fixtures:
    needs: worlds
    runs-on: windows-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SHARDS: 4
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: world-*
          path: assets/worlds
          merge-multiple: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install official Godot
        shell: pwsh
        run: |
          $release = "https://github.com/godotengine/godot-builds/releases/download/$env:GODOT_VERSION-stable"
          Invoke-WebRequest "$release/Godot_v$env:GODOT_VERSION-stable_win64.exe.zip" -OutFile "$env:RUNNER_TEMP/godot.zip"
          Expand-Archive "$env:RUNNER_TEMP/godot.zip" "$env:RUNNER_TEMP/godot"
      - name: Run fixture shard
        shell: pwsh
        run: |
          $godot = "$env:RUNNER_TEMP/godot/Godot_v$env:GODOT_VERSION-stable_win64_console.exe"
          $logs = "build/logs"
          New-Item -ItemType Directory -Force $logs | Out-Null
          New-Item -ItemType File -Force build/.gdignore | Out-Null
          & $godot --headless --path . --editor --import *> "$logs/import.log"
          if ($LASTEXITCODE -ne 0) { Get-Content "$logs/import.log"; exit 1 }
          # Fixtures compare MultiMesh and texture buffers, which the headless renderer discards.
          & $godot --path . --rendering-method gl_compatibility --rendering-driver opengl3_angle --audio-driver Dummy --position -32000,-32000 --resolution 64x64 res://tests/run.tscn -- "--fixture-shard=${{ matrix.shard }}/$env:SHARDS" > "$logs/fixtures.log" 2> "$logs/fixtures-errors.log"
          # Exit code 1 only reports failures; the baseline decides. Anything else is a crash.
          if ($LASTEXITCODE -notin @(0, 1)) { Get-Content "$logs/fixtures.log" -Tail 40; exit 1 }
          Select-String -Path "$logs/fixtures.log" -Pattern '^(SOURCE_SUITE_END|TEST_FAIL|TEST_PASS|SOURCE_FIXTURE_PASS)'
          exit 0
      - name: Compare with known failures
        shell: pwsh
        run: |
          $report = "$env:APPDATA/Godot/app_userdata/Steel vs. Swarm/source-fixture-failures.jsonl"
          Copy-Item $report build/logs/
          node tools/fixture_baseline.mjs check tests/fixture_baseline.json build/logs/source-fixture-failures.jsonl build/logs/fixtures-errors.log build/logs/fixtures.log
      - name: Upload fixture logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-logs-${{ matrix.shard }}
          path: build/logs/
          if-no-files-found: ignore

  build:
    needs: worlds
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: world-*
          path: assets/worlds
          merge-multiple: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate Git payload and captured bytes
        shell: pwsh
        run: |
          node --test tests/git_storage_test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/check_git_storage.mjs --ref HEAD --verify-fixtures
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install official Godot and Web templates
        shell: pwsh
        run: |
          $release = "https://github.com/godotengine/godot-builds/releases/download/$env:GODOT_VERSION-stable"
          $editor = "Godot_v$env:GODOT_VERSION-stable_win64"
          Invoke-WebRequest "$release/$editor.exe.zip" -OutFile "$env:RUNNER_TEMP/godot.zip"
          Expand-Archive "$env:RUNNER_TEMP/godot.zip" "$env:RUNNER_TEMP/godot"
          "$env:RUNNER_TEMP/godot" >> $env:GITHUB_PATH
          Invoke-WebRequest "$release/Godot_v$env:GODOT_VERSION-stable_export_templates.tpz" -OutFile "$env:RUNNER_TEMP/templates.zip"
          $templateRoot = "$env:APPDATA/Godot/export_templates/$env:GODOT_VERSION.stable"
          New-Item -ItemType Directory -Force $templateRoot | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead("$env:RUNNER_TEMP/templates.zip")
          try {
            foreach ($entry in $archive.Entries) {
              if ($entry.Name -in @('web_nothreads_release.zip', 'web_nothreads_debug.zip', 'version.txt')) {
                [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, "$templateRoot/$($entry.Name)", $true)
              }
            }
          } finally { $archive.Dispose() }
      - name: Validate native game and export single-player Web build
        shell: pwsh
        run: ./tools/export_web.ps1 -Godot "Godot_v${env:GODOT_VERSION}-stable_win64_console.exe" -SkipFixtures -NetworkSeason summer
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install chromium
      - name: Run exported game in Chromium
        run: python tools/test_web.py build/web
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-validation-logs
          path: |
            build/logs/
            tests/*-client*.log
            tests/*-server*.log
          if-no-files-found: ignore
      - name: Upload playable build
        uses: actions/upload-artifact@v4
        with:
          name: web-game
          path: build/web/
          include-hidden-files: true
      - name: Package Pages site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, fixtures]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
